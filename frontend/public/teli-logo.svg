<svg width="680" height="270" viewBox="0 0 680 270" xmlns="http://www.w3.org/2000/svg">

  <!-- TV body -->
  <rect x="215" y="40" width="250" height="180" rx="18" fill="none" stroke="white" stroke-width="3"/>

  <!-- Screen bezel -->
  <rect x="232" y="56" width="216" height="148" rx="10" fill="none" stroke="white" stroke-width="2"/>

  <!-- TELI text on screen -->
  <text x="340" y="152" text-anchor="middle" font-family="sans-serif" font-size="62" font-weight="500" fill="white">Teli</text>

  <!-- Antenna left -->
  <line x1="290" y1="40" x2="256" y2="10" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Antenna right -->
  <line x1="390" y1="40" x2="424" y2="10" stroke="white" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Two legs -->
  <line x1="300" y1="220" x2="278" y2="248" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="380" y1="220" x2="402" y2="248" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <!-- Feet -->
  <line x1="266" y1="248" x2="292" y2="248" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="390" y1="248" x2="416" y2="248" stroke="white" stroke-width="3" stroke-linecap="round"/>

</svg>
